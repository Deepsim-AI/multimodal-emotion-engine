[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-emotion-engine"
version = "0.1.0"
description = "Multimodal emotion estimation from visual and voice inputs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Deepsim-AI"}]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "onnxruntime>=1.16", "insightface>=0.7", "deepface>=0.0.84"]
voice = ["sounddevice>=0.4", "librosa>=0.10", "onnxruntime>=1.16"]
demo = ["streamlit>=1.28"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["mee*"]
