[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-emotion-engine"
version = "0.3.0"
description = "Multimodal emotion estimation from visual and voice inputs — commercially safe, Jetson-ready"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "See LICENSE.txt"}
license-files = ["LICENSE.txt", "docs/THIRD_PARTY_LICENSES.md"]
authors = [{name = "Deepsim-AI", email = "ai@deepsim.com"}]
keywords = ["emotion", "multimodal", "Jetson", "facial-expression", "voice-emotion", "edge-computing"]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
mee-lic = "mee.licensing.cli:main"

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8",
    "onnxruntime>=1.16",
    "retina-face>=0.0.18",
    "face-alignment>=1.3",
    "emotiefflib>=1.1",
    # Fallback detector (optional; not required if retina-face is installed)
    "dlib>=19.22; python_version >= '3.10'",
]
voice = [
    "speechbrain>=0.5.14",
    "sounddevice>=0.4",
    "librosa>=0.10",
    "onnxruntime>=1.16",
]
demo = [
    "streamlit>=1.28",
    "sounddevice>=0.4",
    "opencv-python>=4.8",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
include = ["mee*"]
