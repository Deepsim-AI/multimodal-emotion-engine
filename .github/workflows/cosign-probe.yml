name: cosign-probe

on:
  push:
    tags:
      - "v0.0.0-probe*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cosign-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cosign sign + verify (PROBE)
        env:
          COSIGN_PRIVATE_KEY: "${{ secrets.COSIGN_PRIVATE_KEY }}"
        run: |
          set -euo pipefail
          echo "=== COSIGN_PROBE start ==="
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "SECRET_PRESENT=YES (length: $(echo -n \"$COSIGN_PRIVATE_KEY\" | wc -c))"
          else
            echo "SECRET_PRESENT=NO"
            exit 1
          fi
          KEYFILE="$(mktemp)"; chmod 600 "$KEYFILE"
          # If the secret is raw base64 (no PEM headers), wrap it
          if ! echo "$COSIGN_PRIVATE_KEY" | grep -q "BEGIN EC PRIVATE KEY"; then
            echo "--- No PEM headers detected, wrapping key ---"
            { echo "-----BEGIN EC PRIVATE KEY-----"; echo "$COSIGN_PRIVATE_KEY"; echo "-----END EC PRIVATE KEY-----"; } > "$KEYFILE"
          else
            printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$KEYFILE"
          fi
          echo "keyfile: $(wc -c < "$KEYFILE") bytes, $(wc -l < "$KEYFILE") lines"
          # test artifact
          echo "probe artifact" > probe.whl
          openssl dgst -sha256 -sign "$KEYFILE" -out probe.whl.sig probe.whl
          echo "signed probe.whl -> $(wc -c < probe.whl.sig) bytes"
          openssl dgst -sha256 -verify cosign-public.pem -signature probe.whl.sig probe.whl
          echo "VERIFY_EXIT=$?"
          # tamper test
          cp probe.whl probe2.whl; printf 'X' | dd of=probe2.whl bs=1 seek=3 count=1 conv=notrunc 2>/dev/null
          if openssl dgst -sha256 -verify cosign-public.pem -signature probe.whl.sig probe2.whl 2>/dev/null; then
            echo "TAMPER_TEST=FAIL (should have failed)"
          else
            echo "TAMPER_TEST=PASS (correctly rejected)"
          fi
          rm -f "$KEYFILE"
          echo "=== COSIGN_PROBE done ==="
