# TASK_MEE_020 (Phase A, CTO_PLAN §8): Sigstore (Fulcio, keyless) signed
# release pipeline.
#
# Decision #2: Sigstore is the signing scheme. This workflow:
#   1. builds the wheel + sdist,
#   2. generates the integrity anchor file (MEE_INTEGRITY_HASHES.txt) and
#      embeds it in the wheel's .dist-info/ (Decision #3, secondary anchor),
#   3. signs each artifact with Sigstore (keyless — no long-lived signing key;
#      identity is provided automatically by the GitHub runner via OIDC),
#   4. publishes a release manifest with SHA-256 digests (primary anchor), and
#   5. attaches the artifacts + Sigstore bundles + manifest to the release.
#
# sigstore-python is a CI-ONLY dependency (NFR1: zero new runtime deps).
#
# Trigger: tag push (v*.*.*) or manual dispatch (for dry runs).

name: release-sigstore-sign

'on':
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Sigstore keyless signing uses the runner's workload identity.
  id-token: write
  # Required to create/publish a GitHub release on tag push.
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling (CI-only; not a runtime dependency)
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          # sigstore-python pinned to a known-good minor for reproducibility
          # (CTO_PLAN §12 open item: pin for reproducibility).
          python -m pip install "sigstore>=2.1,<3"

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel
        # artifacts land in dist/

      - name: Generate integrity anchor + embed in wheel .dist-info
        run: |
          set -euo pipefail
          python tools/generate_integrity_anchor.py --out MEE_INTEGRITY_HASHES.txt
          # Embed the anchor into the wheel's .dist-info/ so customers can
          # verify integrity offline (Decision #3, secondary anchor).
          python - <<'PY'
          import zipfile, glob, shutil, os
          whl = sorted(glob.glob("dist/*.whl"))[0]
          anchor = "MEE_INTEGRITY_HASHES.txt"
          tmp = whl + ".tmp"
          anchor_bytes = open(anchor, "rb").read()
          with zipfile.ZipFile(whl) as zin:
              names = zin.namelist()
              distinfo = [n for n in names if n.endswith(".dist-info/")]
              if not distinfo:
                  raise SystemExit("no .dist-info/ dir found in wheel")
              prefix = distinfo[0].rsplit("/", 1)[0] + "/"
              target = prefix + "MEE_INTEGRITY_HASHES.txt"
              with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
                  for item in names:
                      zout.writestr(item, zin.read(item))
                  zout.writestr(target, anchor_bytes)
          shutil.move(tmp, whl)
          print("embedded anchor at", target)
          PY

      - name: Compute SHA-256 manifest (primary anchor)
        id: manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, glob, os
          arts = []
          for f in sorted(glob.glob("dist/*")):
              if f.endswith((".sigstore",)):
                  continue
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              arts.append({"name": os.path.basename(f), "sha256": h})
          manifest = {"artifacts": arts, "task": "TASK_MEE_020",
                      "scheme": "sigstore-fulcio-keyless"}
          with open("MEE_RELEASE_MANIFEST.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Sign artifacts with Sigstore (keyless)
        run: |
          set -euo pipefail
          # Sign the wheel, sdist, manifest, and anchor file. The Sigstore
          # bundle is written to a <file>.sigstore/ directory alongside it.
          # Identity is provided by the GitHub runner (OIDC) — no signing key.
          for artifact in MEE_RELEASE_MANIFEST.json MEE_INTEGRITY_HASHES.txt dist/*.whl dist/*.tar.gz; do
            [ -e "$artifact" ] || continue
            echo "signing $artifact"
            sigstore sign --file "$artifact"
          done

      - name: Show signing outputs
        run: |
          echo "--- dist/ ---"; ls -la dist/
          echo "--- sigstore bundles ---"; find . -maxdepth 2 -name "*.sigstore" -o -name "rootbundle.json" | head
          echo "--- manifest ---"; cat MEE_RELEASE_MANIFEST.json

      - name: Upload release artifacts
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            MEE_RELEASE_MANIFEST.json
            MEE_INTEGRITY_HASHES.txt
            dist/*.sigstore/**
        draft: false
        prerelease: false
