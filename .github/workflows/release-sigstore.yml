name: release-sigstore-sign

# Triggered manually (like DS-EO's approach) to avoid push-trigger issues
"on":
  workflow_dispatch:

permissions:
  id-token: write   # Sigstore keyless signing via OIDC
  contents: write   # Create GitHub releases

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.0,<2.0"
          python -m pip install "sigstore-python>=2.1,<3"

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel

      - name: Generate integrity anchor
        run: |
          python tools/generate_integrity_anchor.py --out MEE_INTEGRITY_HASHES.txt
          # Embed in wheel .dist-info/
          python - <<'PY'
          import zipfile, glob, shutil
          whl = sorted(glob.glob("dist/*.whl"))[0]
          anchor_bytes = open("MEE_INTEGRITY_HASHES.txt", "rb").read()
          tmp = whl + ".tmp"
          with zipfile.ZipFile(whl) as zin:
              names = zin.namelist()
              distinfo = [n for n in names if n.endswith(".dist-info/")]
              prefix = distinfo[0].rsplit("/", 1)[0] + "/"
              target = prefix + "MEE_INTEGRITY_HASHES.txt"
              with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
                  for item in names:
                      zout.writestr(item, zin.read(item))
                  zout.writestr(target, anchor_bytes)
          shutil.move(tmp, whl)
          print("embedded anchor at", target)
          PY

      - name: Compute SHA-256 manifest (primary anchor)
        run: |
          python - <<'PY'
          import hashlib, json, glob, os
          arts = []
          for f in sorted(glob.glob("dist/*")):
              if f.endswith((".sigstore",)):
                  continue
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              arts.append({"name": os.path.basename(f), "sha256": h})
          manifest = {"artifacts": arts, "task": "TASK_MEE_020",
                      "scheme": "sigstore-fulcio-keyless"}
          with open("MEE_RELEASE_MANIFEST.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Sign artifacts with Sigstore (keyless)
        run: |
          for artifact in MEE_RELEASE_MANIFEST.json MEE_INTEGRITY_HASHES.txt dist/*.whl dist/*.tar.gz; do
            [ -e "$artifact" ] || continue
            echo "signing $artifact"
            sigstore sign --file "$artifact"
          done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "Release ${{ github.ref_name }}"
          files: |
            dist/*.whl
            dist/*.tar.gz
            MEE_RELEASE_MANIFEST.json
            MEE_INTEGRITY_HASHES.txt
            *.sigstore/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show outputs
        run: |
          echo "Release created at ${{ steps.create_release.outputs.url }}"
