name: release-sigstore-sign

# TASK_MEE_022 G2-1.5: tag-push trigger restored (required for signed release
# pipeline) + workflow_dispatch retained for dry runs.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write   # Sigstore keyless signing via OIDC (Option A, primary path)
  contents: write   # Create GitHub releases

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pip python3-venv
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install "build>=1.0,<2.0"
          /opt/venv/bin/pip install "sigstore>=3.6,<4"  # 3.x (2.x broken with cryptography>=47)
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Build wheel and sdist
        run: python3 -m build --sdist --wheel

      - name: Generate integrity anchor
        run: |
          python3 tools/generate_integrity_anchor.py --out MEE_INTEGRITY_HASHES.txt
          # Embed in wheel .dist-info/
          python3 - <<'PY'
          import zipfile, glob, shutil
          whl = sorted(glob.glob("dist/*.whl"))[0]
          anchor_bytes = open("MEE_INTEGRITY_HASHES.txt", "rb").read()
          tmp = whl + ".tmp"
          with zipfile.ZipFile(whl) as zin:
              names = zin.namelist()
              # Zip has no explicit directory entries — detect .dist-info via its files
              distinfo_dirs = set(n.split("/", 1)[0] for n in names if ".dist-info" in n)
              if not distinfo_dirs:
                  raise SystemExit("no .dist-info entries found in wheel")
              prefix = sorted(distinfo_dirs)[0] + "/"
              target = prefix + "MEE_INTEGRITY_HASHES.txt"
              with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
                  for item in names:
                      zout.writestr(item, zin.read(item))
                  zout.writestr(target, anchor_bytes)
          shutil.move(tmp, whl)
          print("embedded anchor at", target)
          PY

      - name: Compute SHA-256 manifest (primary anchor)
        run: |
          python3 - <<'PY'
          import hashlib, json, glob, os
          arts = []
          for f in sorted(glob.glob("dist/*")):
              if f.endswith((".sigstore",)):
                  continue
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              arts.append({"name": os.path.basename(f), "sha256": h})
          manifest = {"artifacts": arts, "task": "TASK_MEE_022",
                      "scheme": "sigstore-fulcio-keyless"}
          with open("MEE_RELEASE_MANIFEST.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Sign artifacts with Sigstore (keyless)
        continue-on-error: true
        # The Cosign key-based path below is the primary signing mechanism (MEE_029).
        run: |
          # sigstore 3.x: positional file arg (not --file).
          for artifact in MEE_RELEASE_MANIFEST.json MEE_INTEGRITY_HASHES.txt dist/*.whl dist/*.tar.gz; do
            [ -e "$artifact" ] || continue
            echo "signing $artifact"
            sigstore sign "$artifact"
          done
          ls -la dist/*.sigstore.json *.sigstore.json 2>/dev/null || true

      # TASK_MEE_029 (Option B — owner 2026-10-26): additive key-based signing path.
      # Proven in MEE_025_A POC: ECDSA P-256 + SHA-256 (openssl dgst), no Rekor/
      # registry dependency. Runs PARALLEL to the keyless Sigstore path above; both
      # coexist during migration (AC: no breakage). The private key is injected as a
      # secret (never committed); the public key (cosign-public.pem) is committed and
      # distributed to customers.
      - name: Sign artifacts with Cosign key (Option B, additive)
        env:
          COSIGN_PRIVATE_KEY: "${{ secrets.COSIGN_PRIVATE_KEY }}"
        run: |
          set -euo pipefail
          [ -n "${COSIGN_PRIVATE_KEY:-}" ] || { echo "ERROR: COSIGN_PRIVATE_KEY secret not set"; exit 1; }
          # Stage the private key to a temp file with 0600 perms (do not echo value).
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          # If the secret is raw base64 (no PEM headers), wrap it.
          if ! echo "$COSIGN_PRIVATE_KEY" | grep -q "BEGIN EC PRIVATE KEY"; then
            echo "--- No PEM headers detected, wrapping key ---"
            { echo "-----BEGIN EC PRIVATE KEY-----"; echo "$COSIGN_PRIVATE_KEY"; echo "-----END EC PRIVATE KEY-----"; } > "$KEYFILE"
          else
            printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$KEYFILE"
          fi
          trap 'rm -f "$KEYFILE"' EXIT
          # Sign every release artifact (wheel, sdist, manifest, anchor).
          for artifact in MEE_RELEASE_MANIFEST.json MEE_INTEGRITY_HASHES.txt dist/*.whl dist/*.tar.gz; do
            [ -e "$artifact" ] || continue
            echo "cosign-signing $artifact"
            openssl dgst -sha256 -sign "$KEYFILE" -out "${artifact}.sig" "$artifact"
          done
          echo "cosign signatures:"
          ls -la dist/*.sig *.sig 2>/dev/null || true

      # TASK_MEE_029: TEMPORARY probe — proves the COSIGN_PRIVATE_KEY secret resolves
      # in CI and signs correctly. Remove after the tag-push test passes.
      - name: COSIGN_PROBE (temporary, remove after test)
        if: always()
        env:
          COSIGN_PRIVATE_KEY: "${{ secrets.COSIGN_PRIVATE_KEY }}"
        run: |
          set +e
          echo "=== COSIGN_PROBE ==="
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "SECRET_PRESENT=YES"
          else
            echo "SECRET_PRESENT=NO  <-- the COSIGN_PRIVATE_KEY secret is NOT visible to this job"
          fi
          # If a wheel sig exists, verify it against the committed public key locally.
          if ls dist/*.whl.sig >/dev/null 2>&1; then
            WHL=$(ls dist/*.whl | head -1)
            echo "verifying $WHL against cosign-public.pem"
            openssl dgst -sha256 -verify cosign-public.pem -signature "${WHL}.sig" "$WHL"
            echo "PROBE_VERIFY_EXIT=$?"
          else
            echo "NO wheel .sig produced (Cosign signing step may have failed or been skipped)"
          fi
          echo "=== end COSIGN_PROBE ==="

      - name: Verify Cosign signatures (CI self-check, Option B)
        run: |
          set -euo pipefail
          # Public key is committed at repo root (distributable).
          for artifact in MEE_RELEASE_MANIFEST.json MEE_INTEGRITY_HASHES.txt dist/*.whl dist/*.tar.gz; do
            [ -e "$artifact" ] || continue
            echo "cosign-verifying $artifact"
            openssl dgst -sha256 -verify cosign-public.pem -signature "${artifact}.sig" "$artifact"
          done
          echo "All Cosign (Option B) verifications PASSED"

      - name: Verify signatures (CI self-check)
        continue-on-error: true
        run: |
          set -euo pipefail
          REPO="Deepsim-AI/multimodal-emotion-engine"
          NAME="release-sigstore-sign"
          verify() {
            local bundle="$1" artifact="$2"
            echo "== verifying $artifact against $bundle"
            sigstore verify github \
              --bundle "$bundle" \
              --repository "$REPO" \
              --name "$NAME" \
              "$artifact"
          }
          verify MEE_INTEGRITY_HASHES.txt.sigstore.json MEE_INTEGRITY_HASHES.txt
          verify MEE_RELEASE_MANIFEST.json.sigstore.json MEE_RELEASE_MANIFEST.json
          for whl in dist/*.whl; do
            verify "${whl}.sigstore.json" "$whl"
          done
          for sdist in dist/*.tar.gz; do
            verify "${sdist}.sigstore.json" "$sdist"
          done
          echo "All Sigstore verifications PASSED"

      - name: Create Forgejo Release
        id: create_release
        env:
          RELEASE_TAG: "${{ github.ref_name }}"
        run: |
          set -euo pipefail
          # Forgejo/Gitea API: create release + upload assets.
          # FORGEJO_TOKEN is auto-provided by the Forgejo runner.
          TOKEN="${FORGEJO_TOKEN:-${{ secrets.FORGEJO_TOKEN }}}"
          [ -n "$TOKEN" ] || { echo "ERROR: FORGEJO_TOKEN not available"; exit 1; }
          API="https://forge.deepsim.ai:8443/api/v1"
          REPO="deepsim/multimodal-emotion-engine"
          AUTH="Authorization: Bearer $TOKEN"

          # Create release (ignore 422 if it already exists)
          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$RELEASE_TAG\", \"name\": \"Release $RELEASE_TAG\", \"body\": \"Signed release for $RELEASE_TAG\"}" \
            "$API/repos/$REPO/releases" 2>/dev/null | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -sf -H "$AUTH" "$API/repos/$REPO/releases" 2>/dev/null | grep -o '\"tag_name\":\"'$RELEASE_TAG'"[^}]*' | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          fi
          echo "Release ID: $RELEASE_ID"
          [ -n "$RELEASE_ID" ] || { echo "ERROR: could not determine release ID"; exit 1; }

          # Upload each asset
          upload_asset() {
            local file="$1"
            local name="$(basename "$file")"
            echo "Uploading $name..."
            curl -sf -X POST -H "$AUTH" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Disposition: attachment; filename=\"$name\"" \
              --data-binary @"$file" \
              "$API/repos/$REPO/releases/$RELEASE_ID/assets"
          }

          for f in dist/*.whl dist/*.tar.gz dist/*.sigstore.json dist/*.sig \
                   MEE_RELEASE_MANIFEST.json MEE_INTEGRITY_HASHES.txt \
                   MEE_RELEASE_MANIFEST.json.sigstore.json MEE_INTEGRITY_HASHES.txt.sigstore.json \
                   MEE_RELEASE_MANIFEST.json.sig MEE_INTEGRITY_HASHES.txt.sig \
                   cosign-public.pem; do
            [ -e "$f" ] || continue
            upload_asset "$f"
          done
          echo "Release $RELEASE_TAG created with all assets"

      - name: Show outputs
        run: |
          echo "Release created at ${{ steps.create_release.outputs.url }}"
